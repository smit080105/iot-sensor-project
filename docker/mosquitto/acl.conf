# ==============================================================================
# LEAST PRIVILEGE TOPIC ACCESS CONTROL LIST (ACL)
# Deny-by-default: identities can ONLY access their explicitly permitted topics.
# %u = Authenticated username (Common Name from client X.509 certificate)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Edge IoT Sensor Devices (Authenticated via mTLS with CN=<dongle_id>)
# ------------------------------------------------------------------------------

# Registration is isolated in each device's own namespace. A device can
# publish registration only as its certificate CN and can read only its reply.
pattern write device_remo/%u/register
pattern read device_remo/%u/register_ack

# Telemetry, Status, and Feed Publishing:
# Device can ONLY publish to its OWN topic namespace (%u matches its cert CN)
pattern write device_remo/%u/telemetry
pattern write device_remo/%u/status
pattern write device_remo/%u/feed

# Device Inbound Commands & ACKs:
# Device can ONLY subscribe to its OWN direct commands and acknowledgements
pattern read device_remo/%u/commands
pattern read device_remo/%u/ack

# ------------------------------------------------------------------------------
# 2. Backend Ingestion Service (Authenticated via mTLS with CN=backend-service)
# ------------------------------------------------------------------------------
user backend-service

# Read permissions: Ingest telemetry, status, and feeds from registered devices
topic read device_remo/+/telemetry
topic read device_remo/+/status
topic read device_remo/+/feed
# Registration: the backend may process requests and reply in the
# certificate-scoped namespace. Each device can only read its own reply.
topic read device_remo/+/register
topic write device_remo/+/register_ack

# Outbound acknowledgements & device commands:
topic write device_remo/+/ack
topic write device_remo/+/commands
