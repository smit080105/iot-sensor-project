
# HARDENED ENTERPRISE MOSQUITTO BROKER CONFIGURATION
# Zero-Trust Transport: TLS 1.2 Minimum / TLS 1.3 Preferred + Mutual TLS (mTLS)


# 1. PLAINTEXT LISTENERS ARE ENTIRELY DISABLED
# Port 1883 is deliberately NOT configured or exposed to prevent any plaintext traffic.

# 2. MUTUAL TLS (mTLS) LISTENER FOR IOT DEVICES & BACKEND INGESTION
listener 8883
protocol mqtt

# Private PKI Certificate Paths (Mounted into /mosquitto/certs)
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Require client certificate on EVERY connection (Mutual TLS)
# Fails closed: any client without a valid certificate signed by the Root CA is dropped
require_certificate true

# Extract the Common Name (CN) from the client's X.509 certificate as its username
# This binds device identity directly to cryptographic credentials
use_identity_as_username true

# Modern TLS configuration (Prevents downgrade attacks to SSLv3 / TLS 1.0 / TLS 1.1)
tls_version tlsv1.2

# Enterprise-grade cipher suites (Forward secrecy + AEAD ciphers)
ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256

# 3. IDENTITY & ACCESS CONTROL
# Anonymous access is strictly forbidden
allow_anonymous false

# Least-privilege topic access control list
acl_file /mosquitto/config/acl.conf

# 4. AUDIT LOGGING & CONTINUOUS MONITORING
log_dest stdout
log_dest file /mosquitto/log/mosquitto-audit.log

# Log connection events, disconnects, TLS handshakes, and access control violations
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Performance & connection limits
max_connections 1000
max_queued_messages 1000
message_size_limit 262144
