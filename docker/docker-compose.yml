# This file lives in docker/, so build contexts and volume paths use "../"
# Values below come from docker/.env (Compose loads it automatically
# because it sits next to this file).
#
# NOTE: devices are registered by uploading devices.csv (the CSV IS the
# registry). The MQTT handshake with the second party (her device/script)
# on remo_reg/remo_regOK just looks a MAC up in that CSV-backed table
# and echoes it back — see backend/src/mqtt.js and mqtt/PUBLIC_BROKER.md
# for the full flow.

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No "ports" mapping here on purpose — Postgres only needs to be
    # reachable from the backend container over the internal iot-net
    # network. Publishing 5432 to the host widens the attack surface for
    # no benefit; use `docker exec -it postgres psql ...` if you need a
    # local shell into it.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - iot-net

  backend:
    build: ../backend
    container_name: backend
    environment:
      PORT: ${BACKEND_PORT}
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}

      # MQTT Broker with TLS 1.2/1.3 and mTLS support
      MQTT_URL: ${MQTT_URL:-mqtts://mosquitto:8883}
      MQTT_BROKER_MODE: ${MQTT_BROKER_MODE:-private}
      MQTT_AUTH_MODE: ${MQTT_AUTH_MODE:-mtls}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_ALLOW_INSECURE: ${MQTT_ALLOW_INSECURE:-false}
      MQTT_CA_CERT_PATH: /app/certs/ca.crt
      MQTT_CLIENT_CERT_PATH: /app/certs/backend/backend-service.crt
      MQTT_CLIENT_KEY_PATH: /app/certs/backend/backend-service.key

      # Shared secret her device includes in remo_reg. Must match
      # exactly what she publishes, or registration requests get rejected.
      PAIRING_TOKEN: ${PAIRING_TOKEN}

      # Required on every /api/* request (header: x-api-key) except
      # /api/health. Browser users authenticate with their login session.
      API_KEY: ${API_KEY}

      # Only this origin is allowed to call the API from a browser.
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    volumes:
      - ../certs:/app/certs:ro
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - iot-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      # Plaintext port 1883 is deliberately NOT exposed/enabled.
      # Ports 8883-8886 on Windows host are reserved by Windows Hyper-V/NAT port exclusion,
      # so host port 8888 forwards to container port 8883 (MQTTS).
      - "${MOSQUITTO_HOST_PORT:-8888}:8883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
      - ../certs:/mosquitto/certs:ro
      - mosquitto-log:/mosquitto/log
    networks:
      - iot-net

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE}
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - iot-net

networks:
  iot-net:
    driver: bridge

volumes:
  pgdata:
  mosquitto-log:
